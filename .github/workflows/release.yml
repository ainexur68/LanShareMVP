name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Validate tag matches versionName
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          test "v$VERSION_NAME" = "$GITHUB_REF_NAME"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/lanshare-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test, lint and build signed ABI release APKs
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:lintRelease \
            :app:assembleRelease

      - name: Verify all signed production Release APKs
        run: |
          set -euo pipefail
          ABIS=(arm64-v8a armeabi-v7a x86 x86_64)
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test -n "$APKANALYZER"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          for ABI in "${ABIS[@]}"; do
            APK="app/build/outputs/apk/release/app-${ABI}-release.apk"
            test -f "$APK"
            test "$("$APKANALYZER" manifest application-id "$APK")" = "top.nexur.lanshare"
            test "$("$APKANALYZER" manifest debuggable "$APK")" = "false"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          done

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          ABIS=(arm64-v8a armeabi-v7a x86 x86_64)
          mkdir -p release-artifacts
          for ABI in "${ABIS[@]}"; do
            cp "app/build/outputs/apk/release/app-${ABI}-release.apk" \
              "release-artifacts/LanShare-${GITHUB_REF_NAME}-${ABI}.apk"
          done
          (
            cd release-artifacts
            sha256sum ./*.apk > SHA256SUMS.txt
          )

      - name: Report and enforce Release APK size
        run: |
          set -euo pipefail
          mapfile -t APK_FILES < <(find release-artifacts -maxdepth 1 -type f -name '*.apk' | sort)
          test "${#APK_FILES[@]}" -eq 4
          python3 scripts/report_apk_size.py "${APK_FILES[@]}" \
            --max-mib 15 \
            --expect-abis arm64-v8a armeabi-v7a x86 x86_64 \
            --report-file app/build/reports/apk-size-release.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LanShare-${{ github.ref_name }}-release
          path: |
            release-artifacts/*
            app/build/reports/apk-size-release.md
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-artifacts/* \
            --verify-tag \
            --generate-notes \
            --title "LanShare $GITHUB_REF_NAME"
